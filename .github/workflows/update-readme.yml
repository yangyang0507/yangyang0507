name: Update README

on:
  schedule:
    - cron: '0 0 * * *' # 08:00 CST (UTC+8) daily
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/update-readme.yml'
      - '.github/scripts/update-readme.mjs'

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Open Source & Currently Working On sections
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: ${{ github.repository_owner }}
        run: node .github/scripts/update-readme.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "D.Yang"
          git config user.email "koyangslash@gmail.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update README open-source & activity"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

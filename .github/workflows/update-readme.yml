name: Update README

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches: [ master, main ]
    paths:
      - '.github/workflows/update-readme.yml'

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate stats cards
        run: |
          # Official github-readme-stats.vercel.app is often paused, so try
          # a community mirror first. Failure keeps the existing SVG.
          fetch_card() {
            local out="$1" path="$2"; shift 2
            local hosts=("$@") tmp ok=false url
            tmp=$(mktemp)
            for host in "${hosts[@]}"; do
              url="$host/$path"
              echo "Trying $url ..."
              if curl --fail --silent --show-error --location --max-time 60 \
                --retry 2 --retry-delay 5 --retry-all-errors \
                "$url" --output "$tmp" \
                && grep -q '<svg' "$tmp" \
                && ! grep -qi 'something went wrong' "$tmp"; then
                # Generator leftover when hide_title=true
                sed -i '/^[[:space:]]*undefined[[:space:]]*$/d' "$tmp"
                mv "$tmp" "$out"
                ok=true
                echo "Fetched $out"
                break
              fi
            done
            if [ "$ok" != true ]; then
              echo "::warning::All endpoints unavailable for $out, keeping existing file"
            fi
          }

          stats_hosts=(
            "https://github-readme-stats-eight-theta.vercel.app"
            "https://github-readme-stats.vercel.app"
          )
          owner="${{ github.repository_owner }}"
          common="api?username=$owner&show_icons=true&count_private=true&include_all_commits=true&hide_border=true&hide_title=true&hide=issues,prs"
          fetch_card profile/stats.svg "$common" "${stats_hosts[@]}"
          fetch_card profile/stats-dark.svg "$common&bg_color=0d1117&title_color=58a6ff&text_color=c9d1d9&icon_color=58a6ff" "${stats_hosts[@]}"

      - name: Commit changes
        run: |
          git config user.name "D.Yang"
          git config user.email "koyangslash@gmail.com"
          git add profile/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update profile stats"
            git push
          fi
